[build]
  publish = "out"
  command = "npm run build"

# Pages handled by the React app. Every other unknown URL returns a real 404
# (public/404.html). If you add a new page/route to the site, add it here too.
[[redirects]]
  from = "/booking"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/gallery"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/cleaners"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/index.html"
  status = 200

# Private agreement pages (not linked or listed anywhere; also sent with noindex below)
[[redirects]]
  from = "/service-agreement"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/service-agreement/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/services/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/.well-known/ai-catalog.json"
  [headers.values]
    Content-Type = "application/ai-catalog+json"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/service-agreement"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/service-agreement/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
