[build]
  publish = "out"
  command = "npm run build"

# Each public page has its own HTML file with its own title/description/canonical
# (generated by scripts/prerender-head.mjs after the build). These rules serve
# that file at the clean URL. If you add a page, add it to src/seo/routes.ts
# and add a rule here. Every other unknown URL returns a real 404 (public/404.html).
[[redirects]]
  from = "/booking"
  to = "/booking.html"
  status = 200

[[redirects]]
  from = "/gallery"
  to = "/gallery.html"
  status = 200

[[redirects]]
  from = "/cleaners"
  to = "/cleaners.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/services/standard"
  to = "/services/standard.html"
  status = 200

[[redirects]]
  from = "/services/deep"
  to = "/services/deep.html"
  status = 200

[[redirects]]
  from = "/services/move"
  to = "/services/move.html"
  status = 200

[[redirects]]
  from = "/services/commercial"
  to = "/services/commercial.html"
  status = 200

[[redirects]]
  from = "/services/construction"
  to = "/services/construction.html"
  status = 200

[[redirects]]
  from = "/services/airbnb"
  to = "/services/airbnb.html"
  status = 200

# Unknown service slugs still load the app (it shows "service not found")
[[redirects]]
  from = "/services/*"
  to = "/index.html"
  status = 200

# Private agreement pages (not linked or listed anywhere; also sent with noindex below)
[[redirects]]
  from = "/service-agreement"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/service-agreement/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/.well-known/ai-catalog.json"
  [headers.values]
    Content-Type = "application/ai-catalog+json"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/service-agreement"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/service-agreement/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
